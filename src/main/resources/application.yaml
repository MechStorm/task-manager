server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: task-manager-app

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/todo_list_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    root: INFO
    com.javarush.fedorov.taskmanager: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:task-manager}
      secret: ${JWT_SECRET:demo-demo-demo-demo-demo-demo-demo-demo-secret}
      access-token-validity-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}

    users:
      - name: Admin
        email: ${ADMIN_EMAIL:admin@example.com}
        password: ${ADMIN_PASSWORD:adminqwerty}
        role: ADMIN

springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    persist-authorization: true
    operations-sorter: method